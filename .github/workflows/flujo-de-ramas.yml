# Only `staging` enters `main`. Only `develop` enters `staging`.
#
# GitHub rulesets do not know where a pull request COMES FROM: they look at the
# branch being updated, not at the one contributing the commits. You can require
# a PR, and require checks, but not that the source is a specific branch. This is
# the missing piece.
#
# Without it, the flow in docs/08 is an intention: nothing stops opening a PR
# from `feature/whatever` straight into `main`, skipping in one move the staging
# preview, the smoke over the published PDF and the version bump.
#
# ⚠️ THE FILE NAME AND THE JOB ID STAY IN SPANISH ON PURPOSE. `flujo` is the
# status check name required by the `main` and `staging` rulesets, and those
# rulesets live in GitHub's settings, not in this repo. Renaming the job here
# would leave a required check that never reports, and every PR into those two
# branches would be blocked with no way out from the repo side. To rename it:
# change the ruleset first, then this file.
#
# It does not run on PRs into `develop`: any working branch enters there, which
# is exactly what `develop` is for.
#
# An escape hatch for an urgent hotfix: there is none, on purpose. An alternative
# path nobody uses rots without anybody noticing. If going straight to `main` is
# ever necessary, the way out is disabling the check in the ruleset for a while
# and re-enabling it — two clicks, and it is recorded in the repo's audit log.
name: flujo-de-ramas

on:
  pull_request:
    branches: [main, staging]

jobs:
  flujo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The PR comes from the right branch
        env:
          BASE: ${{ github.base_ref }}
          SOURCE: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          case "$BASE" in
            main)    expected=staging ;;
            staging) expected=develop ;;
            *)
              echo "::error::this workflow should not run on '$BASE'. Check the branch filter of the workflow itself."
              exit 1
              ;;
          esac

          # The repo is public: anyone can fork it and open a PR from a branch
          # named `staging`. `head_ref` carries only the NAME, so without this
          # check a fork would pass the filter by being named the same.
          if [ "$SOURCE_REPO" != "$BASE_REPO" ]; then
            echo "::error::this PR comes from the fork $SOURCE_REPO. The internal flow only accepts branches from $BASE_REPO."
            exit 1
          fi

          if [ "$SOURCE" = "$expected" ]; then
            echo "$SOURCE -> $BASE: correct"
            exit 0
          fi

          echo "::error::'$SOURCE' cannot merge into '$BASE'. The flow is feature/* -> develop -> staging -> main (docs/08 section 5): only '$expected' enters '$BASE'."
          exit 1
