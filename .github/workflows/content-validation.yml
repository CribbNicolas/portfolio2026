# Makes the claims in the docs true: the hard rules are CI, not intentions.
# Local equivalent (all of them have to pass):
#   pnpm run test:workflows && pnpm run typecheck && pnpm run validate && pnpm test && pnpm run build && pnpm run pdf:local && pnpm run test:pdf && pnpm run test:js && pnpm run test:bundle && pnpm run test:landing && pnpm run test:endpoints && pnpm run test:og && pnpm run audit:todos
name: content-validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    # GitHub's default is 6 HOURS. A healthy run takes ~1 minute, so anything
    # past 15 is hung, not slow. Without this ceiling, an apt-get that does not
    # respond burns a whole job before anybody notices.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # pnpm BEFORE setup-node: `cache: pnpm` needs the binary to already exist
      # to resolve the store. The other way around, the cache step fails with
      # "Unable to locate executable file: pnpm".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 6 requires Node >=22.12. On 20 the typecheck's `astro sync`
          # refuses to start and the pipeline dies at the first step. 24 is used
          # because it is what the development machine runs: a CI on a different
          # major than dev stops being useful for catching what dev cannot see.
          node-version: 24
          cache: pnpm
      # --frozen-lockfile is pnpm's `npm ci`: it fails if the lockfile does not
      # match package.json instead of fixing it silently. In CI that is what you
      # want — an outdated lockfile has to break the build, not pass.
      - run: pnpm install --frozen-lockfile
      # First of all: if a workflow does not parse, GitHub marks it failed WITH
      # NO JOBS and the gate that file defines stops running without warning.
      # It happened.
      - run: pnpm run test:workflows
      - run: pnpm run typecheck
      - run: pnpm run validate
      - run: pnpm test

      # The dataset's written form. It is committed, it is edited by hand, and
      # a merge can resolve a conflict into something the serializer would never
      # emit — after which the next editor save produces a diff full of
      # reformatting nobody asked for.
      - run: pnpm run test:format

      # The PRODUCTION PDF no longer comes from here: `functions/cv.pdf.ts`
      # generates it on demand with Browser Rendering, which is why
      # `pnpm run build` runs on Cloudflare with no Chromium. Chromium is still
      # installed ONLY for the gate: `pdf:local` produces the PDF `test:pdf`
      # verifies before anything is published. That the SERVED PDF also passes
      # is in `smoke-deploy.yml`.
      #
      # It gets its own step so a browser download failure is not confused with
      # a CV failure.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # No `--with-deps`, on purpose: that flag runs `apt-get` on EVERY run,
      # even when the browser cache hits and there is nothing to download. One
      # run hung for 6 h there because the Ubuntu mirrors were not responding —
      # the same commit that had passed in 1 min. The ubuntu-latest image
      # already ships the libraries Chromium needs.
      # If Chromium ever fails to start, the failure surfaces in the `pdf:local`
      # step below and the way back is adding `--with-deps` again.
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - run: pnpm run build
      # `build` is only `astro build`. The PDF is generated separately, and that
      # is exactly the cut that lets Cloudflare Pages run the build.
      - run: pnpm run pdf:local
      # Here it is verified that the CV passes layer 1 of the funnel:
      # extractable text, sane reading order, no TODOs, no phone number, at most
      # 2 pages.
      - run: pnpm run test:pdf

      # Per-page JS policy over ALL of dist/. It shields /cv: the PDF comes from
      # there and a script slipping in would change the render unnoticed.
      - run: pnpm run test:js
      # Byte budget of the map. The three chunk has to stay off the critical
      # path, not just "be lazy" in words.
      - run: pnpm run test:bundle
      # The landing is the only door: /cv with no incoming links and with
      # noindex, and its CV section in sync with the PDF. Without this, somebody
      # adds a "see full CV" link in three months and nobody finds out.
      - run: pnpm run test:landing
      # The two surfaces agents consume, and the only two that had no gate
      # until now: that `/cv.json` parses and carries the contract keys, and that
      # `/llms.txt` has no empty fields and no split role titles.
      - run: pnpm run test:endpoints
      # The social card. `public/og.jpg` is COMMITTED — rasterizing needs
      # Chromium and the Cloudflare builder does not have it — so it can go stale
      # silently: change the role in the dataset, the site says one thing and
      # what LinkedIn sees keeps saying the other. This compares the fingerprint
      # of the inputs against the JPEG's and fails if somebody forgot
      # `og:local`. It does NOT regenerate the image in CI: the bytes of a JPEG
      # are not reproducible across Chromium versions, so comparing them would
      # be a coin-flip test.
      - run: pnpm run test:og

      # Does not block: these are known pending data. It stays in the log.
      - run: pnpm run audit:todos

      - name: Publish the generated CV
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: dist/cv.pdf
