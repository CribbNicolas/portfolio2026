# Verifies the PUBLISHED site: that the PDF passes the ATS, and that `/cv` is
# still at zero JavaScript in the real response and not in the `dist/` the build
# produced.
#
# `content-validation.yml` verifies `dist/cv.pdf`, generated with Playwright on
# the runner. The PDF people download is printed by Browser Rendering from
# `functions/cv.pdf.ts`: another Chromium, another network, another moment. They
# are the SAME assertions over different bytes.
#
# The first version of this file listened for `deployment_status`, assuming
# Cloudflare Pages created GitHub Deployments. It does NOT: it publishes a *check
# run* called "Cloudflare Pages". The event never fired and this gate went weeks
# without running once, while the Actions list showed everything green. Measured:
# 0 workflow runs, 0 deployments in the repo API.
#
# It now fires on `push`, which does always happen. What that brings is that the
# push and the deploy are not the same moment — Cloudflare takes a minute or two
# — so it has to wait for the URL to serve THIS commit and not the previous one.
# That is what `/build.json` exists for, carrying `CF_PAGES_COMMIT_SHA`.
#
# Sleeping a fixed while instead of asking would be the fragile version: it would
# verify the previous deploy every time the build ran long, and pass green.
name: smoke-deploy

on:
  push:
    branches: [main, staging]
  # To re-run it without pushing anything, when something broke outside.
  workflow_dispatch:

jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # No Chromium: no PDF is generated here, one is only read.
      - run: pnpm install --frozen-lockfile

      - name: Resolve this branch's URL
        run: |
          # `main` is the Production branch; the rest use the per-branch alias
          # Pages builds, `<branch>.<project>.pages.dev`.
          case "${{ github.ref_name }}" in
            main)    site="https://cribbnicolas.pages.dev" ;;
            staging) site="https://staging.cribbnicolas.pages.dev" ;;
            *)
              echo "::error::branch ${{ github.ref_name }} has no known URL. Check the workflow filter."
              exit 1
              ;;
          esac
          echo "SITE=$site" >> "$GITHUB_ENV"
          echo "PDF_SOURCE=$site/cv.pdf" >> "$GITHUB_ENV"
          echo "site: $site"

      - name: Wait for Cloudflare to publish this commit
        run: |
          # It asks for the commit and not for "responds 200": the previous
          # deploy already responds 200 all the time, so that distinguishes
          # nothing.
          expected="${{ github.sha }}"
          echo "waiting for commit $expected at $SITE/build.json"

          for attempt in $(seq 1 30); do
            # `?t=` so it does not get a cached response right when the value has
            # just changed.
            body=$(curl -s --max-time 20 "$SITE/build.json?t=$(date +%s)" || echo '{}')
            published=$(printf '%s' "$body" | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            echo "  attempt $attempt: published=${published:-<no response>}"

            if [ "$published" = "$expected" ]; then
              echo "published"
              exit 0
            fi

            sleep 20
          done

          echo "::error::$SITE never got to serve $expected. Either the Pages build failed, or /build.json does not exist in the published deploy."
          exit 1

      - name: Warm the PDF, tolerating Browser Rendering's 429
        run: |
          # A 429 means "wait", not "the PDF is broken". The free plan gives 3
          # concurrent browsers and one new instance every 20 seconds, and the
          # staging -> main chain is TWO deploys back to back by design: each one
          # asks for a cold render minutes apart. Measured: the first run of this
          # workflow failed exactly like that, with the site healthy — manual
          # verification passed 13 minutes later.
          #
          # Without this step, the gate goes red on quota and trains you to
          # ignore it, which is the worst way to lose a gate.
          #
          # Besides tolerating the 429, it leaves the PDF in the edge cache of
          # the colo the runner landed on, so the test below hits the cache and
          # does not spend ANOTHER render.
          for attempt in $(seq 1 6); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$PDF_SOURCE" || echo 000)
            echo "  attempt $attempt: HTTP $code"

            case "$code" in
              200) echo "PDF ready and cached"; exit 0 ;;
              429)
                # It honours the Retry-After the Function propagates, if it came.
                wait=$(curl -sI --max-time 30 "$PDF_SOURCE" | sed -n 's/^[Rr]etry-[Aa]fter:[[:space:]]*\([0-9]*\).*/\1/p')
                wait=${wait:-30}
                echo "  Browser Rendering quota; retrying in ${wait}s"
                sleep "$wait"
                ;;
              *)
                # 502, 503, 504 or a dead network: it can be transient, but it is
                # not quota. Retried fewer times and with less patience.
                echo "  unexpected response; retrying in 15s"
                sleep 15
                ;;
            esac
          done

          echo "::error::$PDF_SOURCE did not return 200 after 6 attempts. If the last one was a 429, the daily Browser Rendering quota is used up; any other code is a real Function failure."
          exit 1

      - name: The served PDF passes layer 1 of the funnel
        run: pnpm run test:pdf

      - name: The HEAD declares a PDF, not a page
        run: |
          # `-w '%{content_type}'` instead of parsing the header with grep: the
          # header comes terminated with a CR, and stripping it by hand is what
          # once broke this file (a literal CR inside the YAML).
          type=$(curl -sI -o /dev/null -w '%{content_type}' --max-time 60 "$PDF_SOURCE")
          echo "HEAD $PDF_SOURCE -> $type"
          case "$type" in
            application/pdf*) exit 0 ;;
            *) echo "::error::HEAD returns '$type' instead of application/pdf: the HEAD handler does not match the Function" ; exit 1 ;;
          esac

      # The only thing that can see what happens AFTER the build: an edge
      # injection, a transform rule, a misplaced _headers.
      - name: The served response respects the invariants
        run: pnpm run test:served
