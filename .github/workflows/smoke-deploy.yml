# Verifica el sitio PUBLICADO: que el PDF pase el ATS, y que `/cv` siga en cero
# JavaScript en la respuesta real y no en el `dist/` que produjo el build.
#
# `content-validation.yml` verifica `dist/cv.pdf`, generado con Playwright en el
# runner. El PDF que baja la gente lo imprime Browser Rendering desde
# `functions/cv.pdf.ts`: otro Chromium, otra red, otro momento. Son las MISMAS
# assertions sobre bytes distintos.
#
# La primera version de este archivo escuchaba `deployment_status`, asumiendo
# que Cloudflare Pages creaba GitHub Deployments. NO los crea: publica un *check
# run* llamado "Cloudflare Pages". El evento nunca se disparo y este gate estuvo
# semanas sin correr ni una sola vez, mientras la lista de Actions mostraba todo
# en verde. Medido: 0 corridas del workflow, 0 deployments en la API del repo.
#
# Ahora dispara con `push`, que si ocurre siempre. Lo que eso trae es que el
# push y el deploy no son el mismo momento —Cloudflare tarda uno o dos minutos—,
# asi que hay que esperar a que la URL sirva ESTE commit y no el anterior. Para
# eso existe `/build.json`, que lleva `CF_PAGES_COMMIT_SHA`.
#
# Dormir un rato fijo en vez de preguntar seria la version fragil: verificaria
# el deploy anterior cada vez que el build tardara de mas, y pasaria en verde.
name: smoke-deploy

on:
  push:
    branches: [main, staging]
  # Para volver a correrlo sin pushear nada, cuando algo se rompio afuera.
  workflow_dispatch:

jobs:
  publicado:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Sin Chromium: aca no se genera ningun PDF, solo se lee uno.
      - run: pnpm install --frozen-lockfile

      - name: Resolver la URL de esta rama
        run: |
          # `main` es la Production branch; el resto usa el alias por rama que
          # arma Pages, `<rama>.<proyecto>.pages.dev`.
          case "${{ github.ref_name }}" in
            main)    sitio="https://cribbnicolas.pages.dev" ;;
            staging) sitio="https://staging.cribbnicolas.pages.dev" ;;
            *)
              echo "::error::rama ${{ github.ref_name }} sin URL conocida. Revisa el filtro del workflow."
              exit 1
              ;;
          esac
          echo "SITIO=$sitio" >> "$GITHUB_ENV"
          echo "PDF_SOURCE=$sitio/cv.pdf" >> "$GITHUB_ENV"
          echo "sitio: $sitio"

      - name: Esperar a que Cloudflare publique este commit
        run: |
          # Se pregunta por el commit y no por "responde 200": el deploy
          # anterior ya responde 200 todo el tiempo, asi que eso no distingue
          # nada.
          esperado="${{ github.sha }}"
          echo "esperando commit $esperado en $SITIO/build.json"

          for intento in $(seq 1 30); do
            # `?t=` para no comerse una respuesta cacheada justo cuando el valor
            # acaba de cambiar.
            cuerpo=$(curl -s --max-time 20 "$SITIO/build.json?t=$(date +%s)" || echo '{}')
            publicado=$(printf '%s' "$cuerpo" | sed -n 's/.*"commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
            echo "  intento $intento: publicado=${publicado:-<sin respuesta>}"

            if [ "$publicado" = "$esperado" ]; then
              echo "publicado"
              exit 0
            fi

            sleep 20
          done

          echo "::error::$SITIO nunca llego a servir $esperado. O el build de Pages fallo, o /build.json no existe en el deploy publicado."
          exit 1

      - name: El PDF servido pasa la capa 1 del embudo
        run: pnpm run test:pdf

      - name: El HEAD declara un PDF, no una pagina
        run: |
          # `-w '%{content_type}'` en vez de parsear la cabecera con grep: el
          # header viene terminado en CR y sacarlo a mano fue lo que una vez
          # rompio este archivo (un CR literal adentro del YAML).
          tipo=$(curl -sI -o /dev/null -w '%{content_type}' --max-time 60 "$PDF_SOURCE")
          echo "HEAD $PDF_SOURCE -> $tipo"
          case "$tipo" in
            application/pdf*) exit 0 ;;
            *) echo "::error::HEAD devuelve '$tipo' en vez de application/pdf: el handler de HEAD no matchea la Function" ; exit 1 ;;
          esac

      # Lo unico que puede ver lo que pasa DESPUES del build: una inyeccion en
      # el borde, una regla de transformacion, un _headers mal puesto.
      - name: La respuesta servida respeta los invariantes
        run: pnpm run test:servido
