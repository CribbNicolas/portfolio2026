# La versión de package.json sube en cada PR que entra a `develop`.
#
# `package.json` es la única fuente de verdad del versionado (docs/08). Esa
# afirmación es cierta sólo mientras el número cambie cuando cambia el código.
# Dos cambios con el mismo número no es un detalle de prolijidad: es que la
# versión dejó de identificar qué hay adentro, o sea que dejó de servir para lo
# único que sirve.
#
# Se versiona en `develop` y no más adelante porque ahí es donde entra cada
# cambio, uno por uno. `develop` → `staging` y `staging` → `main` no vuelven a
# tocar el número: lo arrastran. Así la versión que se ve en producción es
# exactamente la que se verificó en preview, y antes en integración.
name: version-gate

on:
  pull_request:
    branches: [develop]

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # El checkout de un PR trae sólo la rama del PR. Sin esto,
      # `git show origin/develop:package.json` falla por una razón que no tiene
      # nada que ver con la versión, y el error confunde.
      - name: Traer la rama base
        run: git fetch --depth=1 origin ${{ github.base_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:version
        env:
          VERSION_BASE_REF: origin/${{ github.base_ref }}
