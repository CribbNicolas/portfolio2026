<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Nicolás Cribb">
  <!--
    The open ring: the small half of the brand. The C of the surname, drawn as a
    thick ring with the opening on the right.

    It is ONLY the ring, without the N, and that is deliberate. The full logo
    carries the N inside (`src/components/Logo.astro`), but at 16 px a letter
    becomes a smudge and a silhouette does not. The small icon is identified by
    shape; the letters appear only once there is room to read them.

    Everything is geometry, never a `<text>`: an SVG loaded as an image — which
    is exactly what a favicon is — cannot pull a webfont. Manrope would not load
    and the letter would render in the system font, different on every machine.

    The colors are the accent token from `tokens.css`, written by hand because a
    favicon does not inherit the page CSS. If the palette changes, this file has
    to be touched too: it is the only copy of those values outside `tokens.css`,
    and it is here out of necessity, not oversight. The header logo does NOT
    repeat them, it uses `var()`.

    CAREFUL: the custom properties CANNOT be named here with their two leading
    hyphens. XML forbids that sequence inside a comment, and an SVG loaded as an
    image is parsed as strict XML. The error is visible nowhere: no console, no
    404, the file is served with a 200. The icon simply does not appear. That is
    exactly what happened between 2026-08-25 and the fix.

    `width`/`height` alongside the `viewBox` because Safari does not always give
    an intrinsic size to an SVG carrying only a `viewBox`.

    The `<style>` with `prefers-color-scheme` is honoured in the favicon by
    Chrome, Firefox and Safari; anything that does not support it keeps light
    mode, which reads fine over the tab bar anyway.
  -->
  <style>
    .ring { fill: #b0472a; }
    @media (prefers-color-scheme: dark) {
      .ring { fill: #e2825f; }
    }
  </style>

  <path class="ring" d="M28.1 24.16A14.6 14.6 0 1 1 28.1 7.84L21.31 12.42A6.4 6.4 0 1 0 21.31 19.58Z" />
</svg>
