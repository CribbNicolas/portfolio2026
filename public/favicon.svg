<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mapa de conocimiento">
  <!--
    El mapa de conocimiento, reducido a lo que sobrevive a 16 px: un núcleo y
    dos satélites unidos por aristas. No son iniciales a propósito — la
    identidad del sitio es el grafo, no el nombre, y dos letras a este tamaño se
    leen como una mancha.

    Los colores son los tokens `--acento` y `--tinta` de `tokens.css`, escritos
    a mano porque un favicon no hereda el CSS de la página. Si alguna vez cambia
    la paleta, este archivo hay que tocarlo también: es la única copia de esos
    valores fuera de `tokens.css`, y está acá por necesidad, no por descuido.

    El `<style>` con `prefers-color-scheme` lo respetan Chrome, Firefox y Safari
    en el favicon; el que no lo soporte se queda con el modo claro, que sobre la
    barra de pestañas se ve bien igual.
  -->
  <style>
    .nucleo { fill: #b0472a; }
    .satelite { fill: #17181c; }
    .arista { stroke: #17181c; stroke-width: 1.6; stroke-linecap: round; opacity: 0.55; }
    @media (prefers-color-scheme: dark) {
      .nucleo { fill: #e2825f; }
      .satelite { fill: #f0eeea; }
      .arista { stroke: #f0eeea; }
    }
  </style>

  <line class="arista" x1="16" y1="16" x2="26" y2="7" />
  <line class="arista" x1="16" y1="16" x2="7" y2="24" />

  <circle class="satelite" cx="26" cy="7" r="3.2" />
  <circle class="satelite" cx="7" cy="24" r="2.6" />
  <circle class="nucleo" cx="16" cy="16" r="7" />
</svg>
