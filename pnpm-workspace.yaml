# Dependency postinstall scripts do NOT run unless they are set to true here.
# That is the underlying reason for the switch to pnpm: with npm, any package in
# the tree (452 in total) executes arbitrary scripts on install. Here the list is
# explicit and reviewable in the diff.
#
# esbuild and sharp ship a prebuilt binary as a per-platform optional package
# (@esbuild/*, @img/sharp-*), so their postinstall is a fallback and is not
# needed. If the build ever dies over a missing binary, the fix is setting that
# package to true here and saying why.
allowBuilds:
  esbuild: false
  sharp: false
